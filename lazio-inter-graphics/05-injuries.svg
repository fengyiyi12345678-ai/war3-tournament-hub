<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0000"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <style>.zh { font-family: 'PingFang SC','Microsoft YaHei','Source Han Sans CN',sans-serif; }</style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg5)"/>

  <!-- Alert header -->
  <g transform="translate(0,60)">
    <rect width="1080" height="100" fill="#E63946"/>
    <text x="540" y="65" text-anchor="middle" class="zh" font-size="46" font-weight="900" fill="#fff">🚨 国米锋线 · 塌了一半 🚨</text>
  </g>

  <text x="540" y="240" text-anchor="middle" class="zh" font-size="34" font-weight="700" fill="#FFD700">决赛大名单失踪人口报告</text>

  <!-- Card 1: Thuram -->
  <g transform="translate(80,290)">
    <rect width="920" height="280" rx="20" fill="#1A1A1A" stroke="#E63946" stroke-width="4"/>
    <g transform="translate(40,40)">
      <rect width="200" height="200" rx="100" fill="#333"/>
      <text x="100" y="130" text-anchor="middle" font-size="120">🤕</text>
    </g>
    <text x="280" y="100" class="zh" font-size="60" font-weight="900" fill="#fff">图拉姆</text>
    <text x="280" y="160" class="zh" font-size="32" font-weight="700" fill="#FFD700">THURAM · 边锋 · 主力</text>
    <text x="280" y="220" class="zh" font-size="30" font-weight="600" fill="#ccc">训练受伤 · 大概率缺席决赛</text>
    <!-- Big X -->
    <g transform="translate(800,60)">
      <circle cx="60" cy="60" r="60" fill="#E63946"/>
      <text x="60" y="85" text-anchor="middle" class="zh" font-size="80" font-weight="900" fill="#fff">✗</text>
    </g>
  </g>

  <!-- Card 2: Calhanoglu -->
  <g transform="translate(80,600)">
    <rect width="920" height="280" rx="20" fill="#1A1A1A" stroke="#E63946" stroke-width="4"/>
    <g transform="translate(40,40)">
      <rect width="200" height="200" rx="100" fill="#333"/>
      <text x="100" y="130" text-anchor="middle" font-size="120">🩹</text>
    </g>
    <text x="280" y="100" class="zh" font-size="60" font-weight="900" fill="#fff">恰尔汗奥卢</text>
    <text x="280" y="160" class="zh" font-size="32" font-weight="700" fill="#FFD700">CALHA · 中场核心 · 节拍器</text>
    <text x="280" y="220" class="zh" font-size="30" font-weight="600" fill="#ccc">比目鱼肌伤势 · 确定无缘</text>
    <g transform="translate(800,60)">
      <circle cx="60" cy="60" r="60" fill="#E63946"/>
      <text x="60" y="85" text-anchor="middle" class="zh" font-size="80" font-weight="900" fill="#fff">✗</text>
    </g>
  </g>

  <!-- Card 3: Esposito -->
  <g transform="translate(80,910)">
    <rect width="920" height="280" rx="20" fill="#1A1A1A" stroke="#E63946" stroke-width="4"/>
    <g transform="translate(40,40)">
      <rect width="200" height="200" rx="100" fill="#333"/>
      <text x="100" y="130" text-anchor="middle" font-size="120">😣</text>
    </g>
    <text x="280" y="100" class="zh" font-size="60" font-weight="900" fill="#fff">小埃斯波西托</text>
    <text x="280" y="160" class="zh" font-size="32" font-weight="700" fill="#FFD700">ESPOSITO · 锋线轮换</text>
    <text x="280" y="220" class="zh" font-size="30" font-weight="600" fill="#ccc">长期背伤 · 状态存疑</text>
    <g transform="translate(800,60)">
      <circle cx="60" cy="60" r="60" fill="#E63946"/>
      <text x="60" y="85" text-anchor="middle" class="zh" font-size="80" font-weight="900" fill="#fff">✗</text>
    </g>
  </g>

  <!-- Footer punch -->
  <text x="540" y="1280" text-anchor="middle" class="zh" font-size="44" font-weight="900" fill="#FFD700">三大主力 ➜ 全部 ❌</text>
  <text x="1020" y="1330" text-anchor="end" class="zh" font-size="26" font-weight="700" fill="#fff" opacity="0.6">◀ 05 / 10 ▶</text>
</svg>
