<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <radialGradient id="spot10" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <style>.zh { font-family: 'PingFang SC','Microsoft YaHei','Source Han Sans CN',sans-serif; }</style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg10)"/>
  <rect width="1080" height="1350" fill="url(#spot10)"/>

  <!-- Top label -->
  <g transform="translate(290,80)">
    <rect width="500" height="80" rx="40" fill="#000"/>
    <text x="250" y="55" text-anchor="middle" class="zh" font-size="36" font-weight="900" fill="#FFD700">🔥 互动时间 🔥</text>
  </g>

  <!-- Question -->
  <text x="540" y="290" text-anchor="middle" class="zh" font-size="84" font-weight="900" fill="#fff">你 押 谁？</text>
  <text x="540" y="370" text-anchor="middle" class="zh" font-size="30" font-weight="700" fill="#FFD700" letter-spacing="6">— 评论区见真章 —</text>

  <!-- Button 1 (Inter) -->
  <g transform="translate(80,460)">
    <rect width="920" height="200" rx="30" fill="#000" stroke="#FFD700" stroke-width="5"/>
    <g transform="translate(50,40)">
      <circle cx="60" cy="60" r="60" fill="#FFD700"/>
      <text x="60" y="90" text-anchor="middle" class="zh" font-size="80" font-weight="900" fill="#000">1</text>
    </g>
    <text x="200" y="90" class="zh" font-size="50" font-weight="900" fill="#fff">扣【1】= 国米双冠</text>
    <text x="200" y="150" class="zh" font-size="30" font-weight="700" fill="#FFD700">21 冠 + 意大利杯 · 王朝降临</text>
  </g>

  <!-- Button 2 (Lazio) -->
  <g transform="translate(80,700)">
    <rect width="920" height="200" rx="30" fill="#fff"/>
    <g transform="translate(50,40)">
      <circle cx="60" cy="60" r="60" fill="#E63946"/>
      <text x="60" y="90" text-anchor="middle" class="zh" font-size="80" font-weight="900" fill="#fff">2</text>
    </g>
    <text x="200" y="90" class="zh" font-size="50" font-weight="900" fill="#000">扣【2】= 拉齐奥爆冷</text>
    <text x="200" y="150" class="zh" font-size="30" font-weight="700" fill="#E63946">26 年了 · 蓝鹰再起</text>
  </g>

  <!-- Follow CTA -->
  <g transform="translate(0,950)">
    <rect width="1080" height="220" fill="#000"/>
    <text x="540" y="80" text-anchor="middle" class="zh" font-size="42" font-weight="900" fill="#FFD700">🔔 关注我</text>
    <text x="540" y="140" text-anchor="middle" class="zh" font-size="36" font-weight="800" fill="#fff">明天带你 · 复盘真实战况</text>
    <text x="540" y="195" text-anchor="middle" class="zh" font-size="30" font-weight="700" fill="#FFD700">⚽ 每天一场硬核解说</text>
  </g>

  <!-- Bottom signature -->
  <g transform="translate(0,1190)">
    <rect width="1080" height="160" fill="#1A0000"/>
    <text x="540" y="70" text-anchor="middle" class="zh" font-size="32" font-weight="700" fill="#fff">⬇ 点赞 · 收藏 · 转发 ⬇</text>
    <text x="540" y="125" text-anchor="middle" class="zh" font-size="26" font-weight="600" fill="#FFD700">今晚 21:00 · 罗马奥林匹克 · 不见不散</text>
  </g>

  <text x="1020" y="1330" text-anchor="end" class="zh" font-size="22" font-weight="700" fill="#fff" opacity="0.7">◀ 10 / 10 ✓</text>
</svg>
