<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="50%" stop-color="#009EE0"/>
      <stop offset="100%" stop-color="#003E70"/>
    </linearGradient>
    <style>.zh { font-family: 'PingFang SC','Microsoft YaHei','Source Han Sans CN',sans-serif; }</style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg6)"/>

  <!-- Eagle silhouette decoration -->
  <text x="540" y="350" text-anchor="middle" font-size="220" opacity="0.12">🦅</text>

  <!-- Header -->
  <g transform="translate(0,60)">
    <rect width="1080" height="100" fill="#fff"/>
    <text x="540" y="65" text-anchor="middle" class="zh" font-size="46" font-weight="900" fill="#009EE0">🦅 那拉齐奥呢？</text>
  </g>

  <text x="540" y="280" text-anchor="middle" class="zh" font-size="50" font-weight="900" fill="#fff">三重 BUFF · 满血归来</text>

  <!-- Buff 1 -->
  <g transform="translate(80,390)">
    <rect width="920" height="180" rx="20" fill="#fff" opacity="0.95"/>
    <text x="40" y="100" font-size="80">🔥</text>
    <text x="160" y="85" class="zh" font-size="44" font-weight="900" fill="#0A3D62">队长 扎卡尼 伤愈回归</text>
    <text x="160" y="135" class="zh" font-size="30" font-weight="700" fill="#E63946">右脚淤伤无骨折 · 大名单确认</text>
  </g>

  <!-- Buff 2 -->
  <g transform="translate(80,600)">
    <rect width="920" height="180" rx="20" fill="#fff" opacity="0.95"/>
    <text x="40" y="100" font-size="80">🔥</text>
    <text x="160" y="85" class="zh" font-size="44" font-weight="900" fill="#0A3D62">近 10 场 仅输 1 场</text>
    <text x="160" y="135" class="zh" font-size="30" font-weight="700" fill="#E63946">近 4 场连续不败 · 状态正盛</text>
  </g>

  <!-- Buff 3 -->
  <g transform="translate(80,810)">
    <rect width="920" height="180" rx="20" fill="#fff" opacity="0.95"/>
    <text x="40" y="100" font-size="80">🔥</text>
    <text x="160" y="85" class="zh" font-size="44" font-weight="900" fill="#0A3D62">主场 + 罗马城 加持</text>
    <text x="160" y="135" class="zh" font-size="30" font-weight="700" fill="#E63946">北看台 Curva Nord 大型 Tifo</text>
  </g>

  <!-- Punch line -->
  <g transform="translate(0,1060)">
    <rect width="1080" height="160" fill="#003E70"/>
    <text x="540" y="80" text-anchor="middle" class="zh" font-size="48" font-weight="900" fill="#FFD700">蓝鹰 · 不是过去那只蓝鹰</text>
    <text x="540" y="135" text-anchor="middle" class="zh" font-size="34" font-weight="700" fill="#fff">这一战 · 他们准备很久了</text>
  </g>

  <text x="1020" y="1320" text-anchor="end" class="zh" font-size="26" font-weight="700" fill="#fff" opacity="0.8">◀ 06 / 10 ▶</text>
</svg>
